<style>
  :root{
    --bg:#100d0b; --panel:#1b1714; --panel2:#221d19;
    --ink:#f4ede4; --dim:#8a7d70; --line:#2e2722;
    --accent:#ff5a1f; --accent2:#ffb347;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{font-family:'Barlow',sans-serif;color:var(--ink);
       padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none}
  input{font-family:inherit}
  input:focus{outline:2px solid var(--accent)}
  .card-in{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .modal-in{animation:pop .28s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
  .timer-done{animation:flash .8s ease-in-out infinite}
  @keyframes flash{0%,100%{background:var(--panel)}50%{background:#3a2a12}}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "ironlog-data-v1";
const STARTERS = ["Bench Press","Squat","Deadlift","Overhead Press","Lat Pulldown","Seated Row","Leg Press","Bicep Curl"];
const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString();

function fmtDate(iso){
  const d=new Date(iso), now=new Date();
  const days=Math.floor((now-d)/86400000);
  if(days<=0) return "today";
  if(days===1) return "yesterday";
  if(days<7) return days+" days ago";
  if(days<14) return "last week";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function staleness(iso, y, r){
  if(!iso) return null;
  const days=Math.floor((Date.now()-new Date(iso))/86400000);
  if(days>r) return {level:"overdue",days};
  if(days>y) return {level:"due",days};
  return {level:"fresh",days};
}

const DEF = { sets:3, reps:8, rest:90, yellowDays:3, redDays:5 };
function load(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw){ const p=JSON.parse(raw);
    return { unit:p.unit||"lbs", exercises:p.exercises||[], defaults:{...DEF, ...(p.defaults||{})} }; } }catch(e){}
  return { unit:"lbs", exercises:[], defaults:{...DEF} };
}

function App(){
  const [data,setData]=useState(load);
  const [logging,setLogging]=useState(null);
  const [historyFor,setHistoryFor]=useState(null);
  const [adding,setAdding]=useState(false);
  const [settingsOpen,setSettingsOpen]=useState(false);

  const persist=(next)=>{ setData(next); try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(next)); }catch(e){ console.error(e); } };

  const addExercise=(name)=>{
    const clean=name.trim(); if(!clean){return;}
    if(data.exercises.some(e=>e.name.toLowerCase()===clean.toLowerCase())){ setAdding(false); return; }
    persist({...data, exercises:[...data.exercises,{id:uid(),name:clean,history:[]}]});
    setAdding(false);
  };
  const removeExercise=(id)=>persist({...data, exercises:data.exercises.filter(e=>e.id!==id)});
  const logSet=(id,entry)=>{
    persist({...data, exercises:data.exercises.map(e=> e.id===id
      ? {...e, history:[{...entry,id:uid(),date:todayISO()}, ...e.history]} : e)});
    setLogging(null);
  };
  const deleteEntry=(exId,entryId)=>persist({...data, exercises:data.exercises.map(e=>
    e.id===exId ? {...e, history:e.history.filter(h=>h.id!==entryId)} : e)});
  const toggleUnit=()=>persist({...data, unit:data.unit==="lbs"?"kg":"lbs"});
  const setDefaults=(defaults)=>{ persist({...data, defaults}); setSettingsOpen(false); };

  const loggingEx=data.exercises.find(e=>e.id===logging);
  const historyEx=data.exercises.find(e=>e.id===historyFor);

  return (
    <div style={S.root}>
      <div style={S.glow}/>
      <div style={S.shell}>
        <header style={S.header}>
          <div>
            <div style={S.kicker}>YOUR TRAINING LOG</div>
            <h1 style={S.logo}>IRON<span style={{color:"var(--accent)"}}>LOG</span></h1>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={toggleUnit} style={S.unitBtn}>
              <span style={{opacity:data.unit==="lbs"?1:0.35}}>LBS</span>
              <span style={{opacity:0.3}}>/</span>
              <span style={{opacity:data.unit==="kg"?1:0.35}}>KG</span>
            </button>
            <button onClick={()=>setSettingsOpen(true)} style={S.gearBtn} aria-label="Settings">⚙</button>
          </div>
        </header>

        <RestTimer duration={data.defaults.rest} />

        {data.exercises.length===0 ? (
          <EmptyState onAdd={()=>setAdding(true)} onQuick={addExercise}/>
        ) : (
          <div style={S.list}>
            {data.exercises.map((ex,i)=>(
              <ExerciseCard key={ex.id} ex={ex} unit={data.unit} index={i} defaults={data.defaults}
                onLog={()=>setLogging(ex.id)} onHistory={()=>setHistoryFor(ex.id)}
                onRemove={()=>removeExercise(ex.id)}/>
            ))}
            <button style={S.addRow} onClick={()=>setAdding(true)}>+ add exercise</button>
          </div>
        )}
      </div>

      {loggingEx && <LogModal ex={loggingEx} unit={data.unit} defaults={data.defaults} onClose={()=>setLogging(null)} onSave={(en)=>logSet(loggingEx.id,en)}/>}
      {historyEx && <HistoryModal ex={historyEx} unit={data.unit} onClose={()=>setHistoryFor(null)} onDelete={(eid)=>deleteEntry(historyEx.id,eid)}/>}
      {adding && <AddModal existing={data.exercises} onClose={()=>setAdding(false)} onAdd={addExercise}/>}
      {settingsOpen && <SettingsModal defaults={data.defaults} onClose={()=>setSettingsOpen(false)} onSave={setDefaults}/>}
    </div>
  );
}

function RestTimer({duration}){
  const [secs,setSecs]=useState(duration);
  const [running,setRunning]=useState(false);
  const [done,setDone]=useState(false);
  const endRef=useRef(0), ctxRef=useRef(null), firedRef=useRef(false);

  useEffect(()=>{
    if(!running) return;
    const id=setInterval(()=>{
      const remaining=Math.max(0, Math.round((endRef.current-Date.now())/1000));
      setSecs(remaining);
    },250);
    return ()=>clearInterval(id);
  },[running]);

  useEffect(()=>{ if(!running){ setSecs(duration); setDone(false); } },[duration]);

  useEffect(()=>{
    if(running && secs===0 && !firedRef.current){
      firedRef.current=true; setRunning(false); setDone(true); chime();
      try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    }
  },[secs,running]);

  const unlock=()=>{ try{
    if(!ctxRef.current){ const Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx) ctxRef.current=new Ctx(); }
    if(ctxRef.current && ctxRef.current.state==="suspended") ctxRef.current.resume();
  }catch(e){} };

  const chime=()=>{
    const ctx=ctxRef.current; if(!ctx) return;
    const tone=(delay,freq)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=freq;
      o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.start(t); o.stop(t+0.32);
    };
    tone(0,880); tone(0.32,1175);
  };

  const onTap=()=>{
    unlock();
    if(running){ setRunning(false); setSecs(duration); setDone(false); firedRef.current=false; }
    else { firedRef.current=false; setDone(false); setSecs(duration);
      endRef.current=Date.now()+duration*1000; setRunning(true); }
  };

  const mm=Math.floor(secs/60), ss=secs%60;
  const timeStr=mm+":"+String(ss).padStart(2,"0");
  const pct=running?(secs/duration)*100:done?0:100;
  const cta=running?"RESET":done?"GO AGAIN":"START";
  const timeColor=running?"var(--accent)":done?"var(--accent2)":"var(--ink)";

  return (
    <div style={S.timer} className={done?"timer-done":""} onClick={onTap}>
      <span style={S.timerLabel}>REST</span>
      <span style={{...S.timerTime, color:timeColor}}>{timeStr}</span>
      <span style={S.timerCta}>{cta}</span>
      <div style={{...S.timerBar, width:pct+"%", opacity:running?1:0.25}}/>
    </div>
  );
}

function ExerciseCard({ex,unit,index,defaults,onLog,onHistory,onRemove}){
  const last=ex.history[0];
  const st=last?staleness(last.date, defaults.yellowDays, defaults.redDays):null;
  const tint=st&&st.level!=="fresh"?S.cardTint[st.level]:null;
  const warnColor=st&&st.level==="overdue"?"#ff7a5c":st&&st.level==="due"?"#ffcf5a":"var(--dim)";
  const tag=st&&st.level==="overdue"?"OVERDUE":st&&st.level==="due"?"DUE":null;
  return (
    <div style={{...S.card, ...(tint||{}), animationDelay:(index*60)+"ms"}} className="card-in">
      <div style={S.cardTop}>
        <div style={{minWidth:0}}>
          <div style={S.exName}>{ex.name}</div>
          {last ? (
            <div>
              <div style={{...S.lastLabel, color:warnColor}}>LAST · {fmtDate(last.date)}{tag?(" · "+tag):""}</div>
              <div style={S.lastStats}>
                <span style={S.bigNum}>{last.weight}</span>
                <span style={S.unitTag}>{unit}</span>
                <span style={S.dim}>·</span>
                <span style={S.setsReps}>{last.sets} × {last.reps}</span>
              </div>
            </div>
          ) : <div style={S.noData}>no sets logged yet</div>}
        </div>
        <button style={S.trashBtn} onClick={onRemove}>✕</button>
      </div>
      <div style={S.cardBtns}>
        <button style={S.logBtn} onClick={onLog}>LOG TODAY</button>
        <button style={{...S.histBtn, opacity:last?1:0.4}} onClick={onHistory} disabled={!last}>History ({ex.history.length})</button>
      </div>
    </div>
  );
}

function LogModal({ex,unit,defaults,onClose,onSave}){
  const last=ex.history[0];
  const [weight,setWeight]=useState(last?String(last.weight):"");
  const [sets,setSets]=useState(String(last?last.sets:defaults.sets));
  const [reps,setReps]=useState(String(last?last.reps:defaults.reps));
  const [note,setNote]=useState("");
  const step=(setter,val,delta,min=0)=>setter(String(Math.max(min,(parseFloat(val)||0)+delta)));
  const save=()=>{ const w=parseFloat(weight); if(isNaN(w)) return;
    onSave({weight:w, sets:parseInt(sets)||1, reps:parseInt(reps)||1, note:note.trim()}); };
  const inc = unit==="kg"?2.5:5;
  return (
    <Modal onClose={onClose}>
      <div style={S.modalKicker}>LOGGING</div>
      <h2 style={S.modalTitle}>{ex.name}</h2>
      {last && <div style={S.lastHint}>Last time: {last.weight} {unit} · {last.sets} × {last.reps}</div>}
      <Stepper label={"Weight ("+unit+")"} value={weight} big
        onMinus={()=>step(setWeight,weight,-inc)} onPlus={()=>step(setWeight,weight,inc)} onChange={setWeight}/>
      <div style={S.twoCol}>
        <Stepper label="Sets" value={sets} onMinus={()=>step(setSets,sets,-1,1)} onPlus={()=>step(setSets,sets,1,1)} onChange={setSets}/>
        <Stepper label="Reps" value={reps} onMinus={()=>step(setReps,reps,-1,1)} onPlus={()=>step(setReps,reps,1,1)} onChange={setReps}/>
      </div>
      <input style={S.noteInput} placeholder="Note (optional) — e.g. felt easy, go heavier" value={note} onChange={(e)=>setNote(e.target.value)}/>
      <button style={S.saveBtn} onClick={save}>SAVE SET</button>
    </Modal>
  );
}

function Stepper({label,value,onMinus,onPlus,onChange,big,fmt}){
  return (
    <div style={{marginBottom:16}}>
      <div style={S.stepperLabel}>{label}</div>
      <div style={S.stepperRow}>
        <button style={S.stepBtn} onClick={onMinus}>−</button>
        {fmt
          ? <div style={{...S.stepInput, fontSize:big?38:26, display:"flex", alignItems:"center", justifyContent:"center"}}>{fmt(value)}</div>
          : <input style={{...S.stepInput, fontSize:big?38:26}} value={value} inputMode="decimal"
              onChange={(e)=>onChange(e.target.value.replace(/[^0-9.]/g,""))}/>}
        <button style={S.stepBtn} onClick={onPlus}>+</button>
      </div>
    </div>
  );
}

function HistoryModal({ex,unit,onClose,onDelete}){
  const best=ex.history.reduce((m,h)=>Math.max(m,h.weight),0);
  return (
    <Modal onClose={onClose}>
      <div style={S.modalKicker}>HISTORY</div>
      <h2 style={S.modalTitle}>{ex.name}</h2>
      <div style={S.prRow}>
        <span style={S.prLabel}>HEAVIEST</span>
        <span style={S.prVal}>{best} <span style={S.unitTag}>{unit}</span></span>
      </div>
      <div style={S.historyList}>
        {ex.history.map(h=>(
          <div key={h.id} style={S.histItem}>
            <div>
              <div style={S.histMain}><strong style={{color:"var(--ink)"}}>{h.weight}</strong> {unit} · {h.sets} × {h.reps}</div>
              <div style={S.histDate}>
                {new Date(h.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
                {h.note?(" — "+h.note):""}
              </div>
            </div>
            <button style={S.miniTrash} onClick={()=>onDelete(h.id)}>✕</button>
          </div>
        ))}
      </div>
    </Modal>
  );
}

function SettingsModal({defaults,onClose,onSave}){
  const [sets,setSets]=useState(String(defaults.sets));
  const [reps,setReps]=useState(String(defaults.reps));
  const [rest,setRest]=useState(String(defaults.rest));
  const [yellow,setYellow]=useState(String(defaults.yellowDays));
  const [red,setRed]=useState(String(defaults.redDays));
  const step=(setter,val,delta,min=1)=>setter(String(Math.max(min,(parseInt(val)||0)+delta)));
  const fmtTime=(v)=>{ const s=parseInt(v)||0; return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
  const save=()=>{
    const y=Math.max(1, parseInt(yellow)||1);
    const r=Math.max(y, parseInt(red)||y);
    onSave({ sets:parseInt(sets)||1, reps:parseInt(reps)||1, rest:Math.max(15, parseInt(rest)||90), yellowDays:y, redDays:r });
  };
  return (
    <Modal onClose={onClose}>
      <div style={S.modalKicker}>SETTINGS</div>
      <h2 style={S.modalTitle}>Settings</h2>

      <div style={S.settingSection}>DEFAULT SETS &amp; REPS</div>
      <div style={S.lastHint}>Pre-fill the log form for a brand-new exercise.</div>
      <div style={S.twoCol}>
        <Stepper label="Sets" value={sets} onMinus={()=>step(setSets,sets,-1)} onPlus={()=>step(setSets,sets,1)} onChange={setSets}/>
        <Stepper label="Reps" value={reps} onMinus={()=>step(setReps,reps,-1)} onPlus={()=>step(setReps,reps,1)} onChange={setReps}/>
      </div>

      <div style={S.settingSection}>REST TIMER</div>
      <div style={S.lastHint}>How long the countdown runs. Steps of 15 seconds.</div>
      <Stepper label="Countdown (min:sec)" value={rest} fmt={fmtTime}
        onMinus={()=>step(setRest,rest,-15,15)} onPlus={()=>step(setRest,rest,15,15)} onChange={setRest}/>

      <div style={S.settingSection}>OVERDUE COLORS</div>
      <div style={S.lastHint}>Days since last done before a card turns amber, then red.</div>
      <div style={S.twoCol}>
        <Stepper label="Amber after (days)" value={yellow} onMinus={()=>step(setYellow,yellow,-1)} onPlus={()=>step(setYellow,yellow,1)} onChange={setYellow}/>
        <Stepper label="Red after (days)" value={red} onMinus={()=>step(setRed,red,-1)} onPlus={()=>step(setRed,red,1)} onChange={setRed}/>
      </div>

      <button style={S.saveBtn} onClick={save}>SAVE SETTINGS</button>
    </Modal>
  );
}

function AddModal({existing,onClose,onAdd}){
  const [name,setName]=useState("");
  const ref=useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.focus(); },[]);
  const taken=(n)=>existing.some(e=>e.name.toLowerCase()===n.toLowerCase());
  return (
    <Modal onClose={onClose}>
      <div style={S.modalKicker}>NEW EXERCISE</div>
      <h2 style={S.modalTitle}>What did you train?</h2>
      <input ref={ref} style={S.noteInput} placeholder="Exercise name" value={name}
        onChange={(e)=>setName(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&onAdd(name)}/>
      <div style={S.chipWrap}>
        {STARTERS.filter(s=>!taken(s)).map(s=>(
          <button key={s} style={S.chip} onClick={()=>onAdd(s)}>{s}</button>
        ))}
      </div>
      <button style={S.saveBtn} onClick={()=>onAdd(name)}>ADD</button>
    </Modal>
  );
}

function EmptyState({onAdd,onQuick}){
  return (
    <div style={S.empty}>
      <div style={{fontSize:44}}>🏋️</div>
      <div style={S.emptyTitle}>Start your log</div>
      <p style={S.emptyText}>Add the exercises you do at the gym. Each time you train, log your weight and reps — next visit you'll see exactly what you did last.</p>
      <div style={S.chipWrap}>
        {STARTERS.map(s=>(<button key={s} style={S.chip} onClick={()=>onQuick(s)}>{s}</button>))}
      </div>
      <button style={{...S.saveBtn, marginTop:20}} onClick={onAdd}>+ ADD YOUR OWN</button>
    </div>
  );
}

function Modal({children,onClose}){
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={S.modal} className="modal-in" onClick={(e)=>e.stopPropagation()}>
        <button style={S.closeX} onClick={onClose}>✕</button>
        {children}
      </div>
    </div>
  );
}
